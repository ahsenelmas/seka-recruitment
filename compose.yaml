name: seka-p01
x-backend: &backend
  image: seka-p01-backend:local
  build: ./backend-laravel
  environment:
    APP_NAME: SEKA
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
    APP_URL: ${APP_URL:-http://localhost:8080}
    SEKA_FRONTEND_URL: ${SEKA_FRONTEND_URL:-http://localhost:8080}
    SEKA_AUTH_MODE: ${SEKA_AUTH_MODE:-demo}
    ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
    ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
    ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
    ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:8080/api/auth/entra/callback}
    DB_CONNECTION: pgsql
    DB_HOST: database
    DB_PORT: "5432"
    DB_DATABASE: ${POSTGRES_DB:-seka_demo}
    DB_USERNAME: ${POSTGRES_USER:-seka_demo}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    DB_SSLMODE: disable
    SESSION_DRIVER: file
    CACHE_STORE: file
    QUEUE_CONNECTION: database
    MAIL_MAILER: log
    LOG_CHANNEL: stderr
  volumes:
    - seka-files:/var/www/html/storage
services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seka_demo}
      POSTGRES_USER: ${POSTGRES_USER:-seka_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - seka-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *backend
    command: [php, artisan, migrate, --force, --no-interaction]
    depends_on:
      database: { condition: service_healthy }
  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
  frontend:
    image: seka-p01-frontend:local
    build: ./frontend
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_started }
      frontend: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 12
  scheduler:
    <<: *backend
    profiles: [operations]
    command: [php, artisan, "schedule:work"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  seka-db:
  seka-files:
